<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Central da Gincana</title>

    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/form.css">
    <link rel="stylesheet" href="style/responsividade.css">

    <script src="script/script.js" defer></script>
    <script src="script/login.js" defer></script>

</head>

<body>

<header class="cabecalho">
    <a class="marca" href="/index.html">URSOS DE <strong>GUERRA</strong></a>
    <div class="menu-area">
        <button class="menu-botao" id="menuBotao" type="button"
            aria-label="Abrir menu" aria-expanded="false" aria-controls="navegacao">☰</button>
        <nav class="navegacao" id="navegacao" aria-label="Navegação principal">

            <a href="index.html">Central da Gincana</a>
            <hr>
            <a href="sobre.html">URSOS DE GUERRA</a>
            <hr>
            <a href="regras.html">Regras da Gincana</a>
        </nav>
    </div>
</header>

    <main class="formulario-container">

        <form id="formLogin">

            <h1>Entrar</h1>

            <p>
                Acesso exclusivo para integrantes cadastrados.
            </p>

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                autocomplete="name"
                required
            >

            <label for="codigo">
                Código de acesso
            </label>

            <input
                type="password"
                id="codigo"
                name="codigo"
                placeholder="Digite seu código"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                ENTRAR
            </button>

            <p id="mensagem"></p>

            <a href="/" class="botao-inicio">
                Voltar ao início
            </a>

        </form>

    </main>

</body>

</html>
